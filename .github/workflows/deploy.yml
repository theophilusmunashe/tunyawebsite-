name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main # Change to your deployment branch if different

jobs:
  web-deploy:
    name: Deploy React App
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Change to ./build/ if using Create React App
          server-dir: ./
          # Do not wipe the server. Scaffold folders (with .gitkeep/.htaccess) upload
          # normally so FTP can create them; only skip runtime data written on the server.
          dangerous-clean-slate: false
          exclude: |
            **/accomodations-data/store.json
            **/accomodations-data/*.tmp